apply plugin: 'com.android.application'

android {
    compileSdkVersion ANDROID_COMPILE_SDK_VERSION
    defaultConfig {
        applicationId "com.mmjang.ankihelper"
        minSdkVersion ANDROID_MIN_SDK
        targetSdkVersion ANDROID_TARGET_SDK_VERSION
        versionCode VERSION_CODE
        versionName VERSION_NAME
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        setProperty("archivesBaseName", "Anki 划词助手" + " " + versionName)
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    packagingOptions {
        exclude 'META-INF/proguard/androidx-annotations.pro'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation(libs.androidx.test.espresso.core) {
        exclude group: 'androidx.annotation', module: 'annotation'
    }

    implementation libs.androidx.appcompat
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.cardview
    implementation libs.androidx.multidex
    implementation libs.material
    implementation libs.androidx.constraintlayout

    //api 'com.ichi2.anki:api:1.1.0alpha5'
    //noinspection GradleDynamicVersion
    api libs.sqliteassethelper
    api libs.litepal
    implementation libs.overscroll.decor
    implementation libs.apmem.layouts
    implementation libs.jsoup
    implementation libs.material.ripple
    implementation libs.filepicker
    implementation(libs.guava) {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation libs.listenablefuture.empty
    implementation libs.threetenabp
    implementation libs.mpandroidchart
    //implementation project(':folioreader')
//    implementation 'com.tencent.bugly:crashreport:latest.release'
    implementation libs.okhttp
    //其中latest.release指代最新Bugly SDK版本号，也可以指定明确的版本号，例如2.2.0
    testImplementation libs.junit
    implementation libs.glide
    annotationProcessor libs.glide.compiler
    implementation libs.fetch2

}
