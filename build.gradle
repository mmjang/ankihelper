// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.KOTLIN_VERSION='1.8.22'

    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath libs.android.gradle.plugin
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath libs.bintray.gradle.plugin
        classpath libs.android.maven.gradle.plugin
        classpath libs.kotlin.gradle.plugin
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://jitpack.io' }
    }
}

ext {
    FOLIOREADER_SDK_VERSION = '0.5.1'
    R2_STREAMER_KOTLIN_VERSION = '1.0.3-5'
    R2_SHARED_KOTLIN_VERSION = '1.0.3-2'

    VERSION_NAME = "2.30.8"
    VERSION_CODE = 152
    ANDROID_MIN_SDK = 21
    ANDROID_COMPILE_SDK_VERSION = 33
    ANDROID_TARGET_SDK_VERSION = 33
    ANDROID_LIB_VERSION = '28.0.0'

    CONSTRAINT_LAYOUT_VERSION = "1.1.3"

    JACKSON_VERSION = '2.8.6'
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects{
    project.evaluationDependsOn(":app")

    project.configurations.all {

        resolutionStrategy.eachDependency { details ->

            if (details.requested.group == 'com.android.support'
                    && !details.requested.name.contains('multidex') ) {
                details.useVersion "28.0.0"
            }
        }
    }
}

