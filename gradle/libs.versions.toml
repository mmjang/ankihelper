[versions]
agp = "7.4.2"
kotlin = "1.8.22"
bintray = "1.7.3"
android-maven = "2.0"

appcompat = "1.6.1"
swiperefreshlayout = "1.1.0"
recyclerview = "1.3.2"
cardview = "1.0.0"
multidex = "2.0.1"
material = "1.8.0"
constraintlayout = "2.1.4"
espresso = "3.5.1"

sqliteassethelper = "2.0.1"
litepal = "1.5.1"
overscroll-decor = "1.0.4"
apmem-layouts = "1.10"
jsoup = "1.10.2"
material-ripple = "1.0.2"
filepicker = "4.1.0"
guava = "31.1-android"
listenablefuture-empty = "9999.0-empty-to-avoid-conflict-with-guava"
threetenabp = "1.1.1"
mpandroidchart = "v3.1.0-alpha"
okhttp = "3.12.1"
junit = "4.12"
glide = "4.8.0"
fetch2 = "2.3.5"

[libraries]
# Buildscript / Plugin dependencies
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
bintray-gradle-plugin = { module = "com.jfrog.bintray.gradle:gradle-bintray-plugin", version.ref = "bintray" }
android-maven-gradle-plugin = { module = "com.github.dcendents:android-maven-gradle-plugin", version.ref = "android-maven" }

# AndroidX & Material
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Third-party libraries
sqliteassethelper = { module = "com.readystatesoftware.sqliteasset:sqliteassethelper", version.ref = "sqliteassethelper" }
litepal = { module = "org.litepal.android:core", version.ref = "litepal" }
overscroll-decor = { module = "me.everything:overscroll-decor-android", version.ref = "overscroll-decor" }
apmem-layouts = { module = "org.apmem.tools:layouts", version.ref = "apmem-layouts" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
material-ripple = { module = "com.balysv:material-ripple", version.ref = "material-ripple" }
filepicker = { module = "com.nononsenseapps:filepicker", version.ref = "filepicker" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
listenablefuture-empty = { module = "com.google.guava:listenablefuture", version.ref = "listenablefuture-empty" }
threetenabp = { module = "com.jakewharton.threetenabp:threetenabp", version.ref = "threetenabp" }
mpandroidchart = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "mpandroidchart" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }
fetch2 = { module = "com.tonyodev.fetch2:fetch2", version.ref = "fetch2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
